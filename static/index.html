<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark"><meta name="description" content="Homewiki — your personal space for notes and ideas.">
<title>Homewiki</title><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon.png" sizes="128x128"><link rel="stylesheet" href="/style.css"><script src="/bookmarks.js" defer></script><script src="/app.js" defer></script>
</head>
<body>
<div class="app">
<aside id="sidebar" aria-label="Wiki sidebar">
<div class="brand"><a id="brand-home" class="brand-home" href="/Home" title="Go to Home">Homewiki</a><div class="sidebar-tools"><button id="new-page" class="icon-button" title="New page" aria-label="New page"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5H6a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-6"/><path d="m15 3 4 4M10 16l4-1L22 7a2.8 2.8 0 0 0-4-4l-8 8-1 5z"/></svg></button><a id="recently-edited" class="icon-button" href="/recently-edited" title="Recently edited" aria-label="Recently edited"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></a><button id="search-open" class="icon-button" title="Search your wiki (Ctrl/Cmd+K)" aria-label="Search your wiki"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg></button><button id="collapse" class="icon-button" title="Collapse sidebar" aria-label="Collapse sidebar"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button></div></div>
<a id="bookmarks-open" class="bookmark-library-link" href="/bookmarks"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Bookmarks</a>
<div class="section-label">Pages <span id="page-count"></span></div>
<nav id="tree" aria-label="Pages"></nav>
<div class="sidebar-bottom"><button id="trash-open"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></svg><span>Recently deleted</span></button><button id="theme-toggle"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13A8.5 8.5 0 0 1 11 3.5 8.5 8.5 0 1 0 20.5 13z"/></svg><span id="theme-label">Dark appearance</span></button><div class="local-note"><i></i> Local & yours <span>Markdown powered</span></div></div>
</aside>
<div class="main-shell">
<header><nav class="breadcrumbs" aria-label="Breadcrumb"><button id="expand" class="icon-button" title="Open sidebar" aria-label="Open sidebar"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button><a class="header-home" href="/Home">Homewiki</a><span class="crumb-divider">/</span><span id="breadcrumb">Home</span></nav><div class="header-actions"><span class="private-badge"><i></i> Private workspace</span><button id="more" class="icon-button" title="Page actions" aria-label="Page actions" aria-expanded="false">•••</button><div id="actions" hidden><button id="new-subpage">New subpage</button><button id="page-history">Page history</button><button id="rename-page">Rename / move page</button><button id="delete-page" class="danger">Delete page</button></div></div></header>
<main id="main"><div class="page-top"><div><h1 id="page-title">Home</h1></div><button id="edit-page" class="outline-button">✎ <span>Edit page</span></button></div>
<div id="notice" role="status" hidden></div>
<div id="reader"><article id="content" class="markdown"></article><div id="page-footer" class="page-footer"><time id="last-edited"></time><span id="word-count"></span></div></div>
<section id="bookmarks-view" hidden aria-label="Bookmark library"></section>
<section id="editor" hidden aria-label="Markdown editor"><div class="editor-toolbar"><div class="editor-tabs"><button id="tab-write" class="selected">Write</button><button id="tab-preview">Preview</button></div><button id="link-picker" class="subtle-button">↗ Insert page link</button><button id="add-image" class="subtle-button">Add image</button><input id="image-files" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden><span class="editor-hint">Markdown</span></div><div id="image-status" class="image-status" role="status">Drop or paste images here · PNG, JPEG, GIF, WebP · up to 10 MB each</div><textarea id="source" spellcheck="true" aria-label="Page Markdown" placeholder="Start writing…"></textarea><article id="preview" class="markdown" hidden></article><div class="editor-bottom"><span id="draft-status" role="status">All changes saved</span><div><button id="cancel-edit" class="subtle-button">Close editor</button><button id="save-page" class="primary-button">Save changes <kbd>⌘ S</kbd></button></div></div></section>
</main>
</div>
</div>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" class="icon-button" aria-label="Close dialog">×</button></div><div id="modal-body"></div></dialog>
<div id="toast" role="status" hidden></div>
</body></html>
