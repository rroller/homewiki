name: Publish container

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - server.py
      - bookmarks.py
      - static/**
      - tests/**
      - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run storage and HTTP tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - name: Build image for smoke testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            HOMEWIKI_REVISION=${{ github.sha }}
          platforms: linux/amd64
          load: true
          tags: homewiki:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test non-root, read-only container
        run: |
          docker run -d --name homewiki-smoke --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --tmpfs /data:rw,uid=10001,gid=10001,mode=0700,size=16m \
            --cap-drop ALL --security-opt no-new-privileges:true homewiki:smoke
          for attempt in $(seq 1 20); do
            if docker exec homewiki-smoke python -c "import json, urllib.request; pages=json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/pages', timeout=2)); assert any(p['path']=='Home' for p in pages); from bookmarks import BookmarkStore; assert BookmarkStore('/data').listing()['total']==0; version=json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/version', timeout=2)); assert version['revision']=='${{ github.sha }}'"; then
              exit 0
            fi
            sleep 1
          done
          docker logs homewiki-smoke
          exit 1
      - name: Publish verified image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            HOMEWIKI_REVISION=${{ github.sha }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Remove smoke-test container
        if: always()
        run: docker rm -f homewiki-smoke || true
